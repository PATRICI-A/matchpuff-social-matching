name: CD – Deploy to Prod

on:
  workflow_run:
    workflows: ["CD – Deploy to QA"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: patrici-a/matchpuff-social-matching
  RESOURCE_GROUP: rg-patricia-prod

jobs:

  deploy-prod:
    name: "Deploy to Prod"
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Tag qa-latest as prod-latest
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest

      - name: Deploy to Prod Container App
        run: |
          az containerapp update \
            --name patricia-social-matching-prod \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest
